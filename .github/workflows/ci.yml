# CI backend Seranya — à committer à la RACINE du dépôt `seranya-back`
# (le chemin final doit être `.github/workflows/ci.yml`).
#
# Vérifie chaque push sur main et chaque pull request : installation propre,
# génération du client Prisma, lint, compilation TypeScript, puis les tests Jest.
# Aucun secret ni base de données n'est nécessaire : les tests mockent Prisma,
# Stripe, Nodemailer et Cloudinary.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule un run en cours si un nouveau commit arrive sur la même branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
