name: Uptime monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Check backend health
        run: |
          URL="${BACKEND_HEALTH_URL:-https://seranya-back.onrender.com/health}"
          echo "Checking backend: $URL"
          # max-time à 60s : le plan gratuit Render met le service en veille après
          # inactivité, un cold start peut prendre 30-50s sur la première requête.
          curl --fail --silent --show-error --max-time 60 "$URL"

      - name: Check frontend availability
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "FRONTEND_URL variable not set, skipping frontend check."
            exit 0
          fi
          echo "Checking frontend: $FRONTEND_URL"
          curl --fail --silent --show-error --max-time 10 "$FRONTEND_URL"
