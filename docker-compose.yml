version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:prod # Modifier pour exécuter le mode production
    env_file:
      - .env # Toutes les valeurs (secrets inclus) vivent dans backend/.env, non versionné

